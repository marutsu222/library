<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心情ライブラリ</title>
  <meta name="description" content="漫画をカテゴリやキーワードから探して読める書籍ライブラリです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./viewer.css">
  <script src="./catalog.js" defer></script>
  <script src="./gallery.js" defer></script>
</head>
<body class="catalog-page">
  <header class="site-header">
    <a class="logo" href="#top" aria-label="ページ上部へ">
      <span class="logo-mark">心</span><span>情ライブラリ</span>
    </a>
    <nav class="header-nav" aria-label="メインナビゲーション">
      <a href="#books">本棚</a><a href="#features">閲覧方法</a><a href="#gallery">ギャラリー</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <h1>漫画でめぐる<br><span>心情文化世界</span></h1>
        <p class="hero-text">少し笑ったり、少し考えたり。ひと休みできる場所になりますように。</p>
      </div>
<div class="hero-visual">
    <img
        src="./assets/top.webp"
        alt="サイト案内キャラクター"
        class="hero-character">
</div>
    </section>

    <section class="search-section" id="books">
      <div class="section-heading">
        <p class="eyebrow">ＬＩＢＲＡＲＹ</p><h2>本棚</h2>
        <p>以下の欄から、読みたい漫画を検索できます。</p>
      </div>
      <div class="filter-panel">
        <label class="search-box">
          <span class="visually-hidden">書籍を検索</span>
          <input id="searchInput" type="search" placeholder="作品名・カテゴリ・キーワードで検索">
        </label>
        <div id="categoryFilters" class="category-filters" aria-label="カテゴリ絞り込み"></div>
        <select id="sortSelect" aria-label="並び順">
          <option value="recommended">新しい順</option><option value="title">古い順</option>
          <option value="title">お気に入りが多い順</option><option value="title">閲覧数が多い順</option>
        </select>
      </div>
      <div class="result-bar">
        <p><strong id="resultCount">0</strong> 冊を表示</p>
        <button id="resetButton" class="text-button" type="button">条件をリセット</button>
      </div>
      <div id="bookGrid" class="book-grid" aria-live="polite"></div>
      <p id="catalogMessage" class="empty-message">書籍情報を読み込んでいます…</p>
    </section>

    <section class="features" id="features">
      <div class="section-heading light"><p class="eyebrow">ＨＯＷ ＴＯ</p><h2>本を読む方法</h2></div>
      <div class="feature-grid">
        <article><span>01</span><h3>読みたい本を探す</h3><p>＊＊＊</p></article>
        <article><span>02</span><h3>本をタップする</h3><p>＊＊＊</p></article>
        <article><span>03</span><h3>スライドして読む</h3><p>＊＊＊</p></article>
      </div>
    </section>

    <section class="gallery-section" id="gallery">
      <div class="gallery-heading">
        <div>
          <p class="eyebrow">ＧＡＬＬＥＲＹ</p>
          <h2>イラスト展示</h2>
          <p>気になる作品を、横にめくりながらゆっくりご覧ください。</p>
        </div>
        <div class="gallery-controls" aria-label="ギャラリー操作">
          <button id="galleryPrev" class="gallery-arrow" type="button" aria-label="前のイラスト">‹</button>
          <span id="galleryCounter" class="gallery-counter">1 / 1</span>
          <button id="galleryNext" class="gallery-arrow" type="button" aria-label="次のイラスト">›</button>
        </div>
      </div>

      <div id="galleryTrack" class="gallery-track" aria-live="polite">
        <div class="gallery-loading">イラストを読み込んでいます…</div>
      </div>
      <div id="galleryDots" class="gallery-dots" aria-label="イラスト位置"></div>
    </section>

    <dialog id="galleryLightbox" class="gallery-lightbox">
      <button id="galleryLightboxClose" class="gallery-lightbox-close" type="button" aria-label="閉じる">×</button>
      <figure class="gallery-lightbox-figure">
        <img id="galleryLightboxImage" src="" alt="">
        <figcaption id="galleryLightboxCaption"></figcaption>
      </figure>
    </dialog>
  </main>

  <footer><div><strong>心情ライブラリ</strong></div><small>© 2026 吉田家庭氏族教会</small></footer>
</body>
</html>
