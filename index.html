<body class="catalog-page">
  <header class="site-header">
    <a class="logo" href="#top" aria-label="ページ上部へ">

    <!-- ===== 共通メニュー：PC / スマホともに三本線ボタン ===== -->
    <div class="header-menu-wrap">
      <button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="メニューを開く"
        aria-expanded="false"
        aria-controls="headerMenu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="headerMenu" class="header-menu" aria-label="メインナビゲーション">
        <a href="#books">本を探す</a>
        <a href="#features">本を読む方法</a>
        <a href="#gallery">イラスト展示コーナー</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <h1>漫画でめぐる<br><span>心情文化世界</span></h1>
        <p class="hero-text">少し笑ったり、少し考えたり。ひと休みできる場所になりますように。</p>
      </div>
<div class="hero-visual">
    <img
        src="./assets/top.png"
        alt="サイト案内キャラクター"
        class="hero-character">
</div>
    </section>

    <section class="search-section" id="books">
      <div class="section-heading">
        <p class="eyebrow">ＬＩＢＲＡＲＹ</p><h2>本を探す</h2>
      </div>
      <div class="filter-panel">
        <label class="search-box">
          <span class="visually-hidden">書籍を検索</span>
          <input id="searchInput" type="search" placeholder="作品名・カテゴリ・キーワードで検索">
        </label>

        <div id="categoryFilters" class="category-filters" aria-label="カテゴリ絞り込み"></div>

        <select id="sortSelect" aria-label="並び順">
          <option value="newest">新しい順</option>
          <option value="oldest">古い順</option>
        </select>

        <button id="resetButton" class="filter-reset-button" type="button">条件をリセット</button>
      </div>

      <div class="result-bar">
        <p><strong id="resultCount">0</strong> 冊を表示　タップして読めます。</p>
      </div>
      <div id="bookGrid" class="book-grid" aria-live="polite"></div>
      <p id="catalogMessage" class="empty-message">書籍情報を読み込んでいます…</p>
    </section>

    <!-- ===== 本を読む方法：説明＋GIF横スライド ===== -->
    <section class="features" id="features">
      <div class="section-heading light">
        <p class="eyebrow">ＨＯＷ ＴＯ</p>
        <h2>本を読む方法</h2>
      </div>

      <div class="howto-track" aria-label="本を読む方法">
        <article class="howto-card">
          <div class="howto-body">
            <p>読みたい本をタップすると、ページが開きます。横スライドで読むことができます。右上の×ボタンで、もとの画面に戻ります。</p>
          </div>
          <div class="howto-image">
            <img src="./assets/howto/01.gif" alt="読みたい本を探す操作動画" loading="lazy" decoding="async">
          </div>
        </article>
               

      </div>
    </section>


    <dialog id="galleryLightbox" class="gallery-lightbox">
      <button id="galleryLightboxClose" class="gallery-lightbox-close" type="button" aria-label="閉じる">×</button>
      <figure class="gallery-lightbox-figure">
        <img id="galleryLightboxImage" src="" alt="">
        <figcaption id="galleryLightboxCaption"></figcaption>
      </figure>
    </dialog>
  </main>

  <footer><div><strong>心情ライブラリ</strong></div><small>© 2026 吉田家庭氏族教会</small></footer>
  <script>
    (() => {
      const track = document.getElementById("galleryTrack");
      const next = document.getElementById("galleryNext");
      if (!track || !next) return;

      let timer = 0;
      let stoppedByUser = false;
      let galleryIsVisible = false;

      const stopAutoSlide = () => {
        stoppedByUser = true;
        window.clearInterval(timer);
        timer = 0;
      };

      const startAutoSlide = () => {
        if (stoppedByUser || timer || track.querySelectorAll(".gallery-card").length < 2) return;
        timer = window.setInterval(() => {
          if (document.hidden || !galleryIsVisible) return;

          const cards = [...track.querySelectorAll(".gallery-card")];
          const current = cards.reduce((nearest, card, index) => {
            const distance = Math.abs(card.offsetLeft - track.scrollLeft);
            return distance < nearest.distance ? { index, distance } : nearest;
          }, { index: 0, distance: Infinity }).index;
          const target = cards[(current + 1) % cards.length];

          track.scrollTo({ left: target.offsetLeft, behavior: "smooth" });
        }, 3500);
      };

      const visibilityObserver = new IntersectionObserver(entries => {
        galleryIsVisible = entries[0]?.isIntersecting === true;
      }, { threshold: 0.2 });
      visibilityObserver.observe(document.getElementById("gallery"));

      ["pointerdown", "touchstart", "wheel", "keydown"].forEach(type => {
        track.addEventListener(type, stopAutoSlide, { passive: true });
      });
      track.addEventListener("focusin", stopAutoSlide);
      document.getElementById("galleryPrev")?.addEventListener("click", stopAutoSlide);
      next.addEventListener("click", event => {
        if (event.isTrusted) stopAutoSlide();
      });

      const observer = new MutationObserver(startAutoSlide);
      observer.observe(track, { childList: true });
      window.addEventListener("load", startAutoSlide);
    })();
  </script>
</body>
</html>
